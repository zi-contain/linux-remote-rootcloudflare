<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111728">
    <title>控制台 - 远控管理系统</title>

    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons 1.11 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- 全局设计系统 -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- ============ 顶部导航 ============ -->
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="brand-icon"><i class="bi bi-terminal-fill"></i></div>
            <span class="brand-text">远控管理系统</span>
        </div>
        <input type="checkbox" id="navToggle" class="nav-toggle-input" aria-label="切换菜单">
        <label for="navToggle" class="nav-toggle-btn" aria-label="菜单">
            <i class="bi bi-list"></i>
        </label>
        <div class="nav-actions">
            <a href="/api-docs.html" class="btn-soft btn-sm" title="API 文档">
                <i class="bi bi-code-slash"></i> API 文档
            </a>
            <div class="nav-user">
                <i class="bi bi-person-circle"></i>
                <span id="navUsername">admin</span>
            </div>
            <a href="javascript:void(0)" class="btn-soft btn-sm" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> 退出
            </a>
        </div>
    </nav>

    <!-- ============ 主容器 ============ -->
    <div class="main-container">

        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="surface-card stat-card is-total">
                <div class="stat-icon"><i class="bi bi-hdd-network"></i></div>
                <div>
                    <div class="stat-value" id="statTotal">-</div>
                    <div class="stat-label">总主机数</div>
                </div>
            </div>
            <div class="surface-card stat-card is-online">
                <div class="stat-icon"><i class="bi bi-broadcast"></i></div>
                <div>
                    <div class="stat-value" id="statOnline">-</div>
                    <div class="stat-label">在线主机</div>
                </div>
            </div>
            <div class="surface-card stat-card is-offline">
                <div class="stat-icon"><i class="bi bi-broadcast-pin"></i></div>
                <div>
                    <div class="stat-value" id="statOffline">-</div>
                    <div class="stat-label">离线主机</div>
                </div>
            </div>
        </div>

        <!-- 一键植入命令 -->
        <div class="surface-card install-section">
            <div class="install-header">
                <i class="bi bi-download"></i>
                <span>一键植入命令</span>
                <span class="hint">在目标机器以 root 执行</span>
            </div>
            <div class="install-cmd-row">
                <code id="installCmd">加载中...</code>
                <button class="btn-soft btn-copy" onclick="copyInstallCmd()">
                    <i class="bi bi-clipboard"></i> 复制
                </button>
            </div>
        </div>

        <!-- 主机列表 -->
        <div class="surface-card agent-section">
            <div class="section-header">
                <h5><i class="bi bi-list-ul"></i> 主机列表</h5>
                <div class="section-toolbar">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="搜索主机 / IP / 备注">
                    </div>
                    <button class="filter-chip active" id="filterAll">全部</button>
                    <button class="filter-chip" id="filterOnline">在线</button>
                    <button class="filter-chip" id="filterOffline">离线</button>
                    <button class="btn-icon" id="refreshBtn" title="刷新">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>状态</th>
                            <th>主机名</th>
                            <th>IP地址</th>
                            <th>系统信息</th>
                            <th>Agent ID</th>
                            <th>备注</th>
                            <th>最后在线</th>
                            <th style="width:200px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="agentList">
                        <tr>
                            <td colspan="8">
                                <div class="table-loading">
                                    <span class="spinner-ring"></span> 加载中...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ============ 编辑备注弹窗 ============ -->
    <div class="modal fade" id="remarkModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-dark">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil"></i> 编辑备注</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="remarkAgentId">
                    <div class="mb-3">
                        <label class="form-label" for="remarkInput">备注内容</label>
                        <input type="text" class="form-control" id="remarkInput" placeholder="请输入备注">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveRemark()">
                        <i class="bi bi-check-lg"></i> 保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ 删除确认弹窗 ============ -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-dark">
                <div class="modal-header">
                    <h5 class="modal-title text-danger">
                        <i class="bi bi-exclamation-triangle"></i> 确认删除
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <p>确定要删除此主机吗？所有关联的命令记录也将被删除。</p>
                    <input type="hidden" id="deleteAgentId">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">
                        <i class="bi bi-trash"></i> 确认删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ 脚本 ============ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script>
        // 退出登录
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await fetch('/api/auth', { method: 'DELETE' });
            } catch (e) {
                // 忽略错误
            }
            window.location.href = '/';
        });

        // 移动端：点击导航项后自动收起汉堡菜单
        (function () {
            var toggle = document.getElementById('navToggle');
            var actions = document.querySelector('.nav-actions');
            if (!toggle || !actions) return;
            actions.addEventListener('click', function (e) {
                if (e.target.closest('a, button')) {
                    toggle.checked = false;
                }
            });
        })();

        // Mobile nav toggle fallback for browsers without :has() support
        (function() {
            var toggle = document.getElementById('navToggle');
            if (!toggle) return;
            document.body.classList.add('nav-ready');
            toggle.addEventListener('change', function() {
                document.body.classList.toggle('nav-open', toggle.checked);
            });
        })();
    </script>

</body>

</html>
