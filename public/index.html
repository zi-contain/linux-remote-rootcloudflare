<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080b16">
    <title>远控管理系统 - 登录</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <!-- Logo 区 -->
            <div class="auth-logo">
                <div class="logo-icon btn-gradient"><i class="bi bi-terminal-fill"></i></div>
                <h1>远控管理系统</h1>
                <small>请登录以继续</small>
            </div>

            <!-- 错误提示 -->
            <div id="loginError" class="alert-soft alert-danger mb-3" style="display:none;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="loginErrorText"></span>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm" autocomplete="off">
                <!-- 用户名 -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text input-group-text-dark"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" name="username" id="username"
                               placeholder="请输入用户名" required autofocus>
                    </div>
                </div>

                <!-- 密码（带显示/隐藏切换） -->
                <div class="mb-4">
                    <div class="input-group">
                        <span class="input-group-text input-group-text-dark"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" name="password" id="password"
                               placeholder="请输入密码" required>
                        <button class="pwd-toggle" type="button" onclick="togglePwd(this)" aria-label="显示密码">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="btn-gradient w-100" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-1"></i> 登录
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 公共脚本 -->
    <script src="assets/js/app.js"></script>
    <script>
        // 密码显示/隐藏切换
        function togglePwd(btn) {
            var input = document.getElementById('password');
            var icon  = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        // 页面加载时检查状态
        (async function() {
            try {
                // 检查是否已安装
                const installRes = await fetch('/api/install', { headers: { 'Accept': 'application/json' } });
                const installData = await installRes.json();
                if (!installData.installed) {
                    window.location.href = '/install.html';
                    return;
                }

                // 检查是否已登录
                const authRes = await fetch('/api/auth', { headers: { 'Accept': 'application/json' } });
                const authData = await authRes.json();
                if (authData.authenticated) {
                    window.location.href = '/dashboard.html';
                    return;
                }
            } catch (e) {
                // 忽略错误，显示登录表单
            }
        })();

        // 表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const errorText = document.getElementById('loginErrorText');
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 登录中...';
            errorDiv.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const res = await fetch('/api/auth', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorText.textContent = data.error || '登录失败';
                    errorDiv.style.display = 'flex';
                }
            } catch (err) {
                errorText.textContent = '网络错误，请重试';
                errorDiv.style.display = 'flex';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> 登录';
            }
        });
    </script>
</body>
</html>
